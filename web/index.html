<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>MizMap</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <div id="map"></div>

    <!-- Live MGRS readout of the point under the cursor. Desktop/hover only;
         JS leaves it hidden on touch (no hover) where the measure panel's
         MGRS row covers the same need. -->
    <div id="cursorReadout" hidden>
        <div class="cursor-readout-row">
            <span class="cursor-readout-label">GRID</span>
            <span class="cursor-readout-value" id="cursorMgrs">—</span>
        </div>
        <div class="cursor-readout-row">
            <span class="cursor-readout-label">L/L</span>
            <span class="cursor-readout-value" id="cursorLatLon">—</span>
        </div>
    </div>

    <!-- Kneeboard-only controls. CSS hides these on the main view. -->
    <button type="button" id="kbMenuBtn" class="kb-floating kb-menu-btn" aria-label="Toggle filters">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg>
    </button>
    <button type="button" id="kbMeasureBtn" class="kb-floating kb-measure-btn" aria-label="Measure (tap then tap a point)">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2"/><path d="m10 10 2 2"/><path d="m13 7 2 2"/></svg>
    </button>

    <div id="filters">
        <div class="filter-topbar">
            <div class="filter-topbar-info">
                <span class="filter-version" id="versionLabel">v?</span>
                <span class="conn-status">
                    <span class="conn-dot status-down" id="wsStatus" aria-label="WebSocket: disconnected"></span>
                    <span class="conn-dot status-down" id="grpcStatus" aria-label="DCS-gRPC: disconnected"></span>
                </span>
            </div>
            <button type="button" id="settingsBtn" class="settings-gear-btn" aria-label="Settings" title="Settings">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            </button>
        </div>
        <div class="filter-row-error" id="grpcError" hidden></div>
        <div class="filter-section" data-section="coalition">
            <button type="button" class="filter-section-header" aria-expanded="true" aria-controls="sec-coalition">
                <span class="filter-section-label">Coalition</span>
                <svg class="filter-section-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
            </button>
            <div class="filter-section-body" id="sec-coalition">
                <div class="filter-chips" role="group" aria-label="Coalition">
                    <label class="filter-chip filter-chip-coal coal-blue">
                        <input type="checkbox" data-filter="coalition" data-value="3" checked />
                        <svg class="chip-glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="6" width="14" height="8" rx="1"/></svg>
                        <span class="chip-cap">Blue</span>
                    </label>
                    <label class="filter-chip filter-chip-coal coal-red">
                        <input type="checkbox" data-filter="coalition" data-value="2" checked />
                        <svg class="chip-glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.5 17.5 10 10 17.5 2.5 10z"/></svg>
                        <span class="chip-cap">Red</span>
                    </label>
                    <label class="filter-chip filter-chip-coal coal-neutral">
                        <input type="checkbox" data-filter="coalition" data-value="1" checked />
                        <svg class="chip-glyph" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="12" height="12" rx="1"/></svg>
                        <span class="chip-cap">Neutral</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="filter-section" data-section="category">
            <button type="button" class="filter-section-header" aria-expanded="true" aria-controls="sec-category">
                <span class="filter-section-label">Units</span>
                <svg class="filter-section-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
            </button>
            <div class="filter-section-body" id="sec-category">
                <div class="filter-chips filter-chips-2col" role="group" aria-label="Unit types">
                    <label class="filter-chip filter-chip-unit">
                        <input type="checkbox" data-filter="category" data-value="1" checked />
                        <svg class="chip-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 4.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
                        <span class="chip-cap">Plane</span>
                    </label>
                    <label class="filter-chip filter-chip-unit">
                        <input type="checkbox" data-filter="category" data-value="2" checked />
                        <svg class="chip-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h13 M10 6v2 M5 8h7l3 3v2H5z M15 11h6 M21 9v4 M7 14v2 M11 14v2 M4 16h9"/></svg>
                        <span class="chip-cap">Helo</span>
                    </label>
                    <label class="filter-chip filter-chip-unit">
                        <input type="checkbox" data-filter="category" data-value="3" checked />
                        <svg class="chip-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h15v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z M6 11h6v3 M12 12h8"/></svg>
                        <span class="chip-cap">Ground</span>
                    </label>
                    <label class="filter-chip filter-chip-unit">
                        <input type="checkbox" data-filter="category" data-value="4" checked />
                        <svg class="chip-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 15h18l-2 4H5z M9 11h5v4 M11 8v3"/></svg>
                        <span class="chip-cap">Ship</span>
                    </label>
                </div>
            </div>
        </div>
        <div class="filter-section" data-section="layers">
            <button type="button" class="filter-section-header" aria-expanded="true" aria-controls="sec-layers">
                <span class="filter-section-label">Layers</span>
                <svg class="filter-section-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
            </button>
            <div class="filter-section-body" id="sec-layers">
                <label class="filter-row"><span class="filter-name">Routes</span><input type="checkbox" data-filter="layers" data-value="routes" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Bullseyes</span><input type="checkbox" data-filter="layers" data-value="bullseyes" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Airbases</span><input type="checkbox" data-filter="layers" data-value="airbases" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Navaids</span><input type="checkbox" data-filter="layers" data-value="navaids" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Map marks</span><input type="checkbox" data-filter="layers" data-value="marks" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Measure</span><input type="checkbox" data-filter="layers" data-value="measure" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Threats</span><input type="checkbox" data-filter="layers" data-value="threats" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Vectors</span><input type="checkbox" data-filter="layers" data-value="vectors" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <label class="filter-row"><span class="filter-name">Trails</span><input type="checkbox" data-filter="layers" data-value="trails" checked /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <div class="filter-row filter-row-select" id="trailLengthRow">
                    <label for="trailLengthSel" class="filter-sublabel">Length</label>
                    <select id="trailLengthSel" class="filter-select">
                        <option value="15">15 s</option>
                        <option value="30">30 s</option>
                        <option value="60" selected>1 min</option>
                        <option value="120">2 min</option>
                        <option value="300">5 min</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="filter-section collapsed" data-section="basemap">
            <button type="button" class="filter-section-header" aria-expanded="false" aria-controls="sec-basemap">
                <span class="filter-section-label">Basemap</span>
                <svg class="filter-section-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
            </button>
            <div class="filter-section-body" id="sec-basemap">
                <div class="filter-row filter-row-select">
                    <label for="basemapSel" class="filter-sublabel">Style</label>
                    <select id="basemapSel" class="filter-select"></select>
                </div>
            </div>
        </div>
        <div class="filter-section collapsed" data-section="fog">
            <button type="button" class="filter-section-header" aria-expanded="false" aria-controls="sec-fog">
                <span class="filter-section-label">Fog of war</span>
                <svg class="filter-section-chevron" viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>
            </button>
            <div class="filter-section-body" id="sec-fog">
                <label class="filter-row" title="Show only what the viewpoint coalition's sensors have detected"><span class="filter-name">Enable</span><input type="checkbox" id="fogToggle" /><span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span></label>
                <div class="filter-row filter-row-select" id="fogViewpointRow">
                    <label for="fogViewpointSel" class="filter-sublabel">View as</label>
                    <select id="fogViewpointSel" class="filter-select">
                        <option value="auto" selected>Own ship</option>
                        <option value="3">Blue</option>
                        <option value="2">Red</option>
                        <option value="1">Neutral</option>
                    </select>
                </div>
                <div class="filter-row filter-row-select" id="fogMemoryRow">
                    <label for="fogMemorySel" class="filter-sublabel">Memory</label>
                    <select id="fogMemorySel" class="filter-select">
                        <option value="0">Off</option>
                        <option value="30">30 s</option>
                        <option value="60" selected>1 min</option>
                        <option value="120">2 min</option>
                        <option value="300">5 min</option>
                    </select>
                </div>
                <div class="filter-row-hint" id="fogHint" hidden>Set <code>evalEnabled = true</code> in dcs-grpc.lua to enable detection.</div>
            </div>
        </div>
    </div>

    <div id="navpanel">
        <label class="nav-switch" title="Toggle navigation mode">
            <span class="nav-switch-label">NAV</span>
            <input type="checkbox" id="navToggle" />
            <span class="mizmap-switch-track"><span class="mizmap-switch-thumb"></span></span>
        </label>
        <div class="nav-data" id="navData" hidden>
            <div class="nav-cell nav-wp">
                <span class="nav-label">WP</span>
                <div class="nav-wp-controls">
                    <button type="button" class="nav-wp-arrow" id="navWpPrev" aria-label="Previous waypoint" title="Previous waypoint">‹</button>
                    <span class="nav-value" id="navWp">—</span>
                    <button type="button" class="nav-wp-arrow" id="navWpNext" aria-label="Next waypoint" title="Next waypoint">›</button>
                </div>
            </div>
            <div class="nav-metrics">
                <span class="nav-label">BRG</span>
                <span class="nav-label">DIST</span>
                <span class="nav-label">ETA</span>
                <span class="nav-value" id="navBrg">—</span>
                <span class="nav-value" id="navDist">—</span>
                <span class="nav-value" id="navEta">—</span>
            </div>
        </div>
    </div>

    <div id="measure" hidden>
        <div class="measure-header">
            <span class="measure-title">MEASURE</span>
            <button type="button" id="measureClear" class="measure-clear" title="Clear (or right-click on map)">×</button>
        </div>
        <div class="measure-row" id="measureBullRow">
            <span class="tlm-label" id="measureBullLabel">Bull</span>
            <span class="tlm-value" id="measureBull">—</span>
            <button type="button" class="measure-copy" data-copy="bull" title="Copy" aria-label="Copy bullseye BRA">
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M3 11V3a1 1 0 0 1 1-1h8"/></svg>
            </button>
        </div>
        <div class="measure-row" id="measureSelfOutRow">
            <span class="tlm-label">Self → Tgt</span>
            <span class="tlm-value" id="measureSelfOut">—</span>
            <button type="button" class="measure-copy" data-copy="self-out" title="Copy" aria-label="Copy self-to-target BRA">
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M3 11V3a1 1 0 0 1 1-1h8"/></svg>
            </button>
        </div>
        <div class="measure-row" id="measureSelfInRow">
            <span class="tlm-label">Tgt → Self</span>
            <span class="tlm-value" id="measureSelfIn">—</span>
            <button type="button" class="measure-copy" data-copy="self-in" title="Copy" aria-label="Copy target-to-self BRA">
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M3 11V3a1 1 0 0 1 1-1h8"/></svg>
            </button>
        </div>
        <div class="measure-row measure-point-row" id="measureGridRow" data-has-value="false">
            <span class="tlm-label">MGRS</span>
            <span class="tlm-value" id="measureGrid">—</span>
            <button type="button" class="measure-copy" data-copy="grid" title="Copy" aria-label="Copy MGRS grid">
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M3 11V3a1 1 0 0 1 1-1h8"/></svg>
            </button>
        </div>
        <div class="measure-row" id="measureLatLonRow" data-has-value="false">
            <span class="tlm-label">L/L</span>
            <span class="tlm-value" id="measureLatLon">—</span>
            <button type="button" class="measure-copy" data-copy="latlon" title="Copy" aria-label="Copy lat/long">
                <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="5" y="5" width="9" height="9" rx="1"/><path d="M3 11V3a1 1 0 0 1 1-1h8"/></svg>
            </button>
        </div>
        <div class="measure-row">
            <span class="tlm-label">Alt</span>
            <span class="tlm-value" id="measureAlt">…</span>
        </div>
    </div>

    <div id="telemetry" data-empty="true" data-selected="false">
        <div class="tlm-cell tlm-name" id="tlmName">—</div>
        <div class="tlm-cell"><span class="tlm-label">LAT</span><span class="tlm-value" id="tlmLat">—</span></div>
        <div class="tlm-cell"><span class="tlm-label">LON</span><span class="tlm-value" id="tlmLon">—</span></div>
        <div class="tlm-cell tlm-mgrs"><span class="tlm-label">MGRS</span><span class="tlm-value" id="tlmMgrs">—</span></div>
        <div class="tlm-cell"><span class="tlm-label">ALT</span><span class="tlm-value" id="tlmAlt">—</span></div>
        <div class="tlm-cell"><span class="tlm-label">GS</span><span class="tlm-value" id="tlmGs">—</span></div>
        <div class="tlm-cell"><span class="tlm-label">VS</span><span class="tlm-value" id="tlmVs">—</span></div>
        <div class="tlm-cell"><span class="tlm-label">HDG</span><span class="tlm-value" id="tlmHdg">—</span></div>
    </div>

    <div id="settingsModal" class="settings-modal" hidden>
        <div class="settings-card" role="dialog" aria-modal="true" aria-label="MizMap settings">
            <div class="settings-header">
                <span class="settings-title">SETTINGS</span>
                <button type="button" id="settingsClose" class="settings-close" aria-label="Close">×</button>
            </div>
            <div class="settings-body">
                <div class="settings-banner" id="settingsBanner" hidden></div>
                <label class="settings-field">
                    <span class="settings-label">DCS install folder</span>
                    <input type="text" id="setDcsDir" class="settings-input" placeholder="auto-detect" autocomplete="off" spellcheck="false" />
                    <span class="settings-hint" id="setDcsHint"></span>
                </label>
                <label class="settings-field">
                    <span class="settings-label">Web server port</span>
                    <input type="number" id="setHttpPort" class="settings-input" min="1" max="65535" />
                    <span class="settings-hint">Restart MizMap to apply.</span>
                </label>
                <label class="settings-field">
                    <span class="settings-label">Bind address</span>
                    <input type="text" id="setHttpHost" class="settings-input" autocomplete="off" spellcheck="false" />
                    <span class="settings-hint">0.0.0.0 = reachable by LAN tablets; 127.0.0.1 = local only. Restart to apply.</span>
                </label>
                <label class="settings-field">
                    <span class="settings-label">DCS-gRPC host</span>
                    <input type="text" id="setGrpcHost" class="settings-input" autocomplete="off" spellcheck="false" />
                    <span class="settings-hint">Restart to apply.</span>
                </label>
                <label class="settings-field">
                    <span class="settings-label">DCS-gRPC port</span>
                    <input type="number" id="setGrpcPort" class="settings-input" min="1" max="65535" />
                    <span class="settings-hint">Restart to apply.</span>
                </label>
                <div class="settings-actions">
                    <span class="settings-msg" id="settingsMsg"></span>
                    <button type="button" id="settingsSave" class="settings-save">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""
    ></script>
    <script src="https://unpkg.com/milsymbol@2.2.0/dist/milsymbol.js"></script>
    <script src="https://unpkg.com/mgrs@2.1.0/dist/mgrs.js"></script>
    <script src="/main.js"></script>
</body>
</html>
