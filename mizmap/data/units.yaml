  # Stinger, Vulcan) and fall back to "?" placeholders otherwise.
  # SA-10 (S-300PS)
  "S-300PS 40B6M tr":       { sidc: "GEWMAL-", threat_km: 75 }   # TEL on truck (transporter-erector-launcher)
  "S-300PS 5P85C ln":       { sidc: "GEWMAL-", threat_km: 75 }   # cold-launch launcher (older variant)
  "S-300PS 5P85D ln":       { sidc: "GEWMAL-", threat_km: 75 }
  # SA-5 (S-200)
  "S-200_Launcher":         { sidc: "GEWMAT-", threat_km: 250 }  # theatre range
