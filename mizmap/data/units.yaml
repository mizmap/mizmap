# Per-DCS-type lookup for refined MIL-STD-2525C symbology + SAM/AAA engagement ranges.
#
# Schema: keys are DCS unit type strings (the `Unit.type` proto field). Each entry has:
#   sidc:       7-char string = 1-char battle dimension + 6-char function code.
#               Spliced into chars 3 + 5-10 of the full 15-char SIDC; affiliation
#               (chars 1-2) and status (4) and modifiers (11-15) come from runtime.
#               Dimension: A=air, G=ground, S=sea-surface. Function codes per
#               MIL-STD-2525C — common ones used here:
#                 A* aircraft (M=military, F=fixed-wing, H=rotary-wing):
#                   MFF (fighter), MFA (attack/strike), MFB (bomber),
#                   MFC (cargo / aerial-refuel tanker), MFR (recon),
#                   MFRW (AEW), MHA (attack helo), MHC (cargo helo),
#                   MHU (utility helo)
#                 G* ground:
#                   UCAAM (MBT), UCAW (wheeled armor), UCATA (tracked APC),
#                   UCAWA (wheeled APC), UCF (field artillery), UCI (infantry),
#                   UCDA (AAA), UCDSA (SAM long-range), UCDSB (SAM medium-range),
#                   UCDSC (SAM short-range), UUMSE (ELINT / non-engaging radar),
#                   EVATL/M/H (truck — light/medium/heavy; the "equipment"
#                   branch used for soft-skin cargo/utility vehicles)
#                 S* sea-surface:
#                   CLCV (aircraft carrier), CLCC (cruiser), CLDD (destroyer),
#                   CLFF (frigate), CN (non-combatant)
#
#   threat_km:  optional. Approximate max engagement range in kilometers. Set on
#               weapon-emitting units only (SAM launchers, AAA, MANPADS).
#               Search/track radars get a refined `sidc` but no `threat_km` —
#               the launcher carries the ring. Values are best-effort
#               approximations from DCS-Wiki / Hoggit / open sources; tweak
#               freely when sources contradict.
#
# Anything not listed falls back to the coarse coalition×category mapping in
# mizmap/sidc.py. Missing entries are NOT an error.

units:

  # ─── Air defense — SAM launchers (sidc + threat_km) ──────────────────────
  # milsymbol recognises the equipment-family codes EWMAL- (long range),
  # EWMAI- (intermediate range), EWMAS- (short range). The unit-family UCDS*
